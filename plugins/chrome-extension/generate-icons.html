<!DOCTYPE html>
<html>
<head>
  <title>Generate Extension Icons</title>
</head>
<body>
  <h2>AI Chat Extractor - Icon Generator</h2>
  <p>点击下面的按钮下载图标，然后保存到 <code>src/icons/</code> 目录：</p>

  <div>
    <h3>步骤：</h3>
    <ol>
      <li>右键点击每个图标，选择"图片另存为"</li>
      <li>保存为对应名称：icon16.png, icon48.png, icon128.png</li>
      <li>保存到 <code>plugins/chrome-extension/src/icons/</code> 目录</li>
    </ol>
  </div>

  <div style="margin: 20px;">
    <h3>16x16:</h3>
    <canvas id="canvas16" width="16" height="16"></canvas>
    <br><br>

    <h3>48x48:</h3>
    <canvas id="canvas48" width="48" height="48"></canvas>
    <br><br>

    <h3>128x128:</h3>
    <canvas id="canvas128" width="128" height="128"></canvas>
  </div>

  <script>
    function drawIcon(canvas, size) {
      const ctx = canvas.getContext('2d');

      // Background gradient
      const gradient = ctx.createLinearGradient(0, 0, size, size);
      gradient.addColorStop(0, '#3B82F6');
      gradient.addColorStop(1, '#1D4ED8');

      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, size, size);

      // Rounded corners effect
      ctx.strokeStyle = 'rgba(255,255,255,0.3)';
      ctx.lineWidth = 2;
      ctx.strokeRect(1, 1, size-2, size-2);

      // Text
      ctx.fillStyle = 'white';
      ctx.font = `bold ${size * 0.5}px Arial`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('AI', size/2, size/2);

      // Allow download
      canvas.style.cursor = 'pointer';
      canvas.title = '右键保存图片为...';

      canvas.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        const link = document.createElement('a');
        link.download = `icon${size}.png`;
        link.href = canvas.toDataURL();
        link.click();
      });
    }

    drawIcon(document.getElementById('canvas16'), 16);
    drawIcon(document.getElementById('canvas48'), 48);
    drawIcon(document.getElementById('canvas128'), 128);
  </script>
</body>
</html>
