version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-chat-extractor-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - DB_PATH=/app/data/database.sqlite
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_API_BASE=https://api.deepseek.com/v1
      - DEEPSEEK_MODEL=deepseek-chat
      - PUPPETEER_HEADLESS=true
      - CORS_ORIGIN=*
      - ADMIN_SECRET_PATH=${ADMIN_SECRET_PATH:-admin-secure-path-123}
      - RATE_LIMIT_WINDOW_MS=60000
      - RATE_LIMIT_MAX_REQUESTS=100
      - LOG_LEVEL=info
    volumes:
      - backend-data:/app/data
      - backend-logs:/app/logs
      - backend-renders:/app/public/renders
    networks:
      - ai-chat-extractor-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health')"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Optional: Nginx reverse proxy for production
  # nginx:
  #   image: nginx:alpine
  #   container_name: ai-chat-extractor-nginx
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./nginx/ssl:/etc/nginx/ssl:ro
  #     - backend-renders:/usr/share/nginx/html/renders:ro
  #   depends_on:
  #     - backend
  #   networks:
  #     - ai-chat-extractor-network

volumes:
  backend-data:
    driver: local
  backend-logs:
    driver: local
  backend-renders:
    driver: local

networks:
  ai-chat-extractor-network:
    driver: bridge
